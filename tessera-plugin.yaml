# Desk panel: one full-page tile for a desk. With the monitor off it shows large keys that start a source; with the
# monitor on, the sources with a dot for each device that runs, the monitor's keys, an Auto key for the chosen source
# and a key that turns a device such as a PC on, and off after a question. Every field is
# explained in docs/MANIFEST.md of tessera-plugins.
id: desk_panel
version: 0.2.0
api: "0.24"
icon: desk
maintainer: Orishas
license: MIT
stage: beta
topics: [home, media]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 50

permissions:
  home_assistant_actions: [script.turn_on, input_select.select_option, select.select_option, switch.turn_on,
                           switch.turn_off, input_boolean.turn_on, input_boolean.turn_off]

cards:
  - { id: confirm, name: card_name }

tiles:
  - id: desk
    name: tile_name
    icon: desk
    sizes: { min: 2x1, max: 2x3 }
    # Six source keys (block, logo, word, dot), three "A" marks, four other keys (block, icon, word), a note, about
    # 3.6 KB; members (sources, layout, texts, image descriptors) about 2.4 KB.
    memory: 6200
    domains: [input_select, select]
    attributes: [options]
    example: tile_example
    preview: { title: "{name}", value: "{state}" }
    options:
      - { id: script, kind: entity, domains: [script], label: script, hint: script_hint }
      - { id: status_1, kind: entity, domains: [binary_sensor, media_player, switch, device_tracker], label: status_1, hint: status_hint }
      - { id: status_2, kind: entity, domains: [binary_sensor, media_player, switch, device_tracker], label: status_2, hint: status_hint }
      - { id: status_3, kind: entity, domains: [binary_sensor, media_player, switch, device_tracker], label: status_3, hint: status_hint }
      - { id: auto_1, kind: entity, domains: [input_boolean, switch], label: auto_1, hint: auto_hint }
      - { id: auto_2, kind: entity, domains: [input_boolean, switch], label: auto_2, hint: auto_hint }
      - { id: auto_3, kind: entity, domains: [input_boolean, switch], label: auto_3, hint: auto_hint }
      - { id: picture, kind: entity, domains: [switch], label: picture, hint: picture_hint }
      - { id: power, kind: entity, domains: [switch], label: power, hint: power_hint }
      - { id: device, kind: entity, domains: [switch, input_boolean], label: device, hint: device_hint }
